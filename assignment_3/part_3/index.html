<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Portfolio Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">
      <img src="images/logo.jpg" alt="Logo">

    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Projects</a>

  <!-- Main -->
  <div class="main-grid">

    <section class="projects">
      <h2>My Projects</h2>

      <div class="project-card">

        <button>View</button>
      </div>

      <div class="project-card">
        <h3>Project 2</h3>
        <p>A short description of project 2.</p>
        <button>View</button>
      </div>

      <div class="project-card">
        <h3>Project 3</h3>
        <p>A short description of project 3.</p>
        <button>View</button>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>About Me</h2>
      <p>Short bio, skills, or contact info.</p>
    </aside>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 My Portfolio | All Rights Reserved
  </footer>
</body>
</html>
